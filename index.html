const cat={nonmetal:'비금속',noble:'비활성 기체',alkali:'알칼리 금속',alkaline:'알칼리 토금속',transition:'전이 금속',metalloid:'준금속',postmetal:'후전이 금속',halogen:'할로젠',lanth:'란타넘족',act:'악티늄족'};const emoji={nonmetal:'🌿',noble:'🎈',alkali:'💧',alkaline:'🦴',transition:'⚙️',metalloid:'💻',postmetal:'🔩',halogen:'🧪',lanth:'✨',act:'☢️'};
function parse(s){return s.split(';').filter(Boolean).map(x=>{let a=x.split('|');let [symbol,name,number,period,group,category]=a;return {symbol,name,number:+number,period:+period,group:+group,category,state:'고체',categoryName:cat[category],emoji:emoji[category],desc:`${name}은(는) ${cat[category]}에 속하는 원소예요. 원자번호는 ${number}이며 주기율표에서 ${period}주기에 위치해요.`,uses:`${name}은(는) ${cat[category]}의 성질을 바탕으로 산업·연구·생활 속 여러 분야에서 활용돼요. 구체적인 용도는 화합물이나 동위원소에 따라 달라져요.`,memory:`${symbol} = ${name}! 원자번호 ${number}와 함께 세트로 외워 보세요.`}})}
const detailed=parse(csv);const extras=parse(names);const elements=[...detailed,...extras].filter((e,i,a)=>a.findIndex(x=>x.number===e.number)===i);const byNum=Object.fromEntries(elements.map(e=>[e.number,e]));const favs=new Set(JSON.parse(localStorage.getItem('oneso-favs')||'[]'));let score=+(localStorage.getItem('oneso-score')||0);sc.textContent=score;fc.textContent=favs.size;
function makeCard(e){let b=document.createElement('button');b.className='el '+e.category;b.dataset.n=e.number;b.innerHTML=`<span class=n>${e.number}</span><span class=sym>${e.symbol}</span><span class=name>${e.name}</span>`;b.onclick=()=>show(e);return b}function makeTable(){periodic.innerHTML='';for(let p=1;p<=7;p++)for(let g=1;g<=18;g++){let slot=document.createElement('div');let e=elements.find(x=>x.period===p&&x.group===g&&x.category!=='lanth'&&x.category!=='act');if(e)slot.appendChild(makeCard(e));periodic.appendChild(slot)}let s=document.getElementById('series');s.innerHTML='';['lanth','act'].forEach(c=>{let h=document.createElement('h3');h.textContent=c==='lanth'?'✨ 란타넘족':'☢️ 악티늄족';s.appendChild(h);let row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:repeat(15,minmax(48px,1fr));gap:5px;min-width:900px';elements.filter(e=>e.category===c).forEach(e=>row.appendChild(makeCard(e)));s.appendChild(row)})}function show(e){detail.innerHTML=`<div class=detail><div class=detail-top><div><div class="big ${e.category}">${e.symbol}</div><h2>${e.name}</h2><div class=sub>${e.symbol} · 원자번호 ${e.number}</div></div><button class=fav>${favs.has(e.number)?'⭐':'☆'}</button></div><span class=badge>${e.emoji} ${e.categoryName}</span><div class=facts><div class=fact><b>주기</b><span>${e.period}주기</span></div><div class=fact><b>족</b><span>${e.group||'-'}족</span></div><div class=fact><b>상태</b><span>${e.state}</span></div><div class=fact><b>원자번호</b><span>${e.number}</span></div></div><div class="box science"><b>🔬 어떤 원소일까?</b><p>${e.desc}</p></div><div class="box uses"><b>🛠 어디에 쓰일까?</b><p>${e.uses}</p></div><div class="box memory"><b>🧠 암기 포인트</b><p>${e.memory}</p></div></div>`;detail.querySelector('.fav').onclick=()=>{favs.has(e.number)?favs.delete(e.number):favs.add(e.number);localStorage.setItem('oneso-favs',JSON.stringify([...favs]));fc.textContent=favs.size;show(e)}}makeTable();
search.oninput=e=>{let q=e.target.value.trim().toLowerCase();document.querySelectorAll('.el').forEach(b=>{let x=byNum[+b.dataset.n];let ok=!q||x.name.toLowerCase().includes(q)||x.symbol.toLowerCase()===q||String(x.number)===q;b.style.opacity=ok?'1':'.2';b.style.filter=ok?'none':'grayscale(1)'})};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['table','quiz','flash'].forEach(v=>document.getElementById(v).style.display=t.dataset.v===v?(v==='table'?'grid':'block'):'none');if(t.dataset.v==='quiz')quiz();if(t.dataset.v==='flash')flash()});
function quiz(){let e=elements[Math.floor(Math.random()*elements.length)],opts=[e,...elements.filter(x=>x!==e).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);quizbox.innerHTML=`<div class=question>원자번호 <b>${e.number}</b>번 원소의 기호는 무엇일까요?</div><div class=answers>${opts.map(x=>`<button class=answer data-a="${x.number}">${x.symbol}</button>`).join('')}</div>`;quizbox.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{quizbox.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(+b.dataset.a===e.number){b.classList.add('correct');score+=10}else b.classList.add('wrong');localStorage.setItem('oneso-score',score);sc.textContent=score;let n=document.createElement('button');n.className='next';n.textContent='다음 문제 →';n.onclick=quiz;quizbox.appendChild(n)})}function flash(){let e=elements[Math.floor(Math.random()*elements.length)];flashbox.innerHTML=`<div class=flash><div class=fs>${e.symbol}</div><div class=fn>${e.name}</div><p>${e.number}번 · ${e.categoryName}</p><button class=next onclick="show(byNum[${e.number}]);document.querySelector('[data-v=table]').click()">자세히 보기</button><button class=next onclick=flash>다음 카드 →</button></div>`}
</script></body></html>
